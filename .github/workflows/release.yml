name: Release

# Two ways to publish a release with dist/*.zip attached:
#  1. GitHub → Actions → Release → "Run workflow", enter a version such as v1.0.0.
#  2. Push a tag such as v1.0.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          sh skills/tibbo-firmware/tests/run.sh
          sh skills/appblocks/tests/run.sh
      - name: Package
        run: sh tools/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # patch notes: the version's section from CHANGELOG.md, then the install hints
          awk -v v="${VERSION#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > changes.md
          cat > notes.md <<EOF
          **Which file do I need?** Install **both** skills - \`appblocks\` uses the TPS checker from \`tibbo-firmware\`.

          - **Claude apps:** Customize → Skills → + → Create skill → Upload a skill → upload \`tibbo-firmware.zip\`, then \`appblocks.zip\`.
          - **Claude Code:** \`/plugin marketplace add ${GITHUB_REPOSITORY}\`, then \`/plugin install tibbo-skills@scancode\`.
          - **Codex, Gemini CLI, Kimi Code, Deep Code (DeepSeek), OpenCode (GLM and others):** download *Source code (zip)*, unpack it and run \`python tools/install.py\` - or unpack both skill zips into \`~/.agents/skills/\`.
          - **Web chats - ChatGPT, Gemini, Kimi, DeepSeek, GLM:** \`tibbo-chat-pack.zip\` (instructions + knowledge files + scripts).

          **Already installed?** Tell your agent "Update the Tibbo skills", or run \`python tools/install.py --update\`. Claude Code plugin: \`/plugin marketplace update scancode\`, then \`/plugin update tibbo-skills@scancode\`. Claude apps, the Kimi app and web chats: replace the files with the new ones - see [Updating](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md#updating).

          Step-by-step: [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md) · [INSTALL.ru.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.ru.md) · [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).
          EOF
          { cat changes.md; echo; echo "---"; echo; cat notes.md; } > release.md
          gh release create "$VERSION" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Tibbo Skills $VERSION" \
            --notes-file release.md
