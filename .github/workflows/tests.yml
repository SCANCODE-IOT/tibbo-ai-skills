name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          # Windows: Git Bash, console code page of the runner, no PYTHONUTF8
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.14" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: tibbo-firmware
        run: env -u PYTHONUTF8 sh skills/tibbo-firmware/tests/run.sh
      - name: appblocks
        run: env -u PYTHONUTF8 sh skills/appblocks/tests/run.sh
      - name: Installer (project folder) and self-test from the installed copy
        run: |
          python tools/install.py --project "$RUNNER_TEMP/proj"
          cd "$RUNNER_TEMP/proj/.agents/skills/appblocks" && env -u PYTHONUTF8 sh tests/run.sh
      - name: Agent Skills spec (skills-ref needs Python 3.11+)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: |
          python -m pip install -q skills-ref==0.1.1
          python -m skills_ref.cli validate skills/tibbo-firmware
          python -m skills_ref.cli validate skills/appblocks
      - name: Package skills and chat pack
        if: runner.os == 'Linux'
        run: sh tools/package.sh

  # Tibbo's own compiler (github.com/tibbotech/tibbo-basic, Node.js): every recipe and every generated project must
  # build. External repository: a failure here is reported but does not block the PR.
  compiler:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Tibbo's compiler
        run: python skills/tibbo-firmware/scripts/tibbo_build.py --setup-node --yes
      - name: recipes on their platforms
        run: env -u PYTHONUTF8 python tools/check_recipes.py "$(python -c "import os; print(os.path.join(os.path.expanduser('~'), '.tibbo', 'tibbo-basic'))")"
      - name: tibbo-firmware suite with the compiler (generated projects, recipes)
        run: env -u PYTHONUTF8 sh skills/tibbo-firmware/tests/run.sh
      - name: what the user sees (doctor)
        run: env -u PYTHONUTF8 python skills/tibbo-firmware/scripts/tibbo_build.py --doctor

  # Real HTTPS to api.appblocks.io from Windows with truststore and with certifi (external service: does not block the PR)
  windows-tls:
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        store: [default, truststore, certifi]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - if: matrix.store != 'default'
        run: python -m pip install -q ${{ matrix.store }}
      - name: chain served by api.appblocks.io (annotations)
        if: matrix.store == 'default'
        run: |
          echo | openssl s_client -connect api.appblocks.io:443 -servername api.appblocks.io -showcerts 2>/dev/null \
            | awk '/^ *[0-9]+ s:/{s=$0} /^ *i:/{i=$0} /NotAfter/{print s" | "i" | "$0}' | while read -r l; do echo "::notice title=chain::$l"; done
          python -c "import ssl,sys; print('::notice title=python::', sys.version.split()[0], ssl.OPENSSL_VERSION)"
      - name: ab_api.py tls + code
        working-directory: skills/appblocks
        run: |
          env -u PYTHONUTF8 python scripts/ab_api.py tls | tee "$RUNNER_TEMP/tls.txt"
          [ "${{ matrix.store }}" = default ] || grep -q "${{ matrix.store }}" "$RUNNER_TEMP/tls.txt"
          env -u PYTHONUTF8 python scripts/ab_api.py code examples/sprinkler5.json --outdir "$RUNNER_TEMP/gen" > "$RUNNER_TEMP/files.txt"
          grep -q "main.tbs" "$RUNNER_TEMP/files.txt"
